[project]
name = "puma-scouts"
version = "0.1.0"
description = "PUMA marketplace product intelligence"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "pydantic>=2.8,<3",
  "openpyxl>=3.1,<4",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
puma-batch = "puma_scouts.production:main"
puma = "puma_scouts.production:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
