[project]
name = "puma-scouts"
version = "0.1.0"
description = "PUMA production marketplace scout for Ukrainian product offers"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "pydantic>=2.8,<3",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
