name: PUMA Epicentr Hunt

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  epicentr-hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PUMA Scout
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Run tests
        run: pytest -q
      - name: Run live Epicentr hunt
        run: |
          python - <<'PY'
          import asyncio, json
          from pathlib import Path
          from puma_scouts.models import ProductMission
          from puma_scouts.scouts.epicentr import EpicentrScout

          async def main():
              mission = ProductMission(
                  article="CONTROL-NOT-A-SEARCH-KEY",
                  source_data={
                      "name": "Монітор Redmi A27Q 2025",
                      "brand": "Redmi",
                      "model": "P27QCB-RA",
                  },
              )
              scout = EpicentrScout(timeout=20.0, max_candidates_per_query=30)
              queries = await scout.generate_queries(mission)
              print("PUMA EPICENTR QUERIES:", json.dumps(queries, ensure_ascii=False))
              if any(q.casefold().strip() == mission.article.casefold().strip() for q in queries):
                  raise RuntimeError("supplier article leaked into Epicentr discovery queries")
              report = await scout.scan(mission)
              payload = report.model_dump(mode="json")
              Path("puma-epicentr-hunt.json").write_text(
                  json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8"
              )
              print("PUMA EPICENTR HUNT RESULT")
              print(json.dumps(payload, ensure_ascii=False, indent=2))

          asyncio.run(main())
          PY
      - name: Upload hunt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puma-epicentr-hunt-${{ github.run_number }}
          path: puma-epicentr-hunt.json
          if-no-files-found: warn
