name: PUMA Multimarket Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/puma-multimarket-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e . pytest pytest-asyncio
      - name: Tests
        run: pytest -q
      - name: Live marketplace smoke
        run: |
          python - <<'PY'
          import asyncio, json
          from puma_scouts.models import ProductMission, Verdict
          from puma_scouts.scouts.epicentr import EpicentrScout
          from puma_scouts.scouts.catalog import AlloScout, FoxtrotScout, ComfyScout, KastaScout, HotlineScout
          mission = ProductMission(article='SMOKE-CONTROL', source_data={'name':'Монитор Xiaomi Redmi A27Q 2025 P27QCB-RA 2560x1440 2K IPS 100 Гц 27 Черный','brand':'Xiaomi','model':'P27QCB-RA'})
          scouts = [EpicentrScout(timeout=15,max_candidates_per_query=12),AlloScout(timeout=15,max_candidates_per_query=12),FoxtrotScout(timeout=15,max_candidates_per_query=12),ComfyScout(timeout=15,max_candidates_per_query=12),KastaScout(timeout=15,max_candidates_per_query=12),HotlineScout(timeout=15,max_candidates_per_query=12)]
          async def one(scout):
              report = await scout.scan(mission)
              passes = sorted([x for x in report.offers if x.verdict == Verdict.PASS], key=lambda x:x.score, reverse=True)
              row = {'marketplace':scout.marketplace.value,'health':report.health.value,'candidates':report.candidates_collected,'pass_count':len(passes),'best':None if not passes else {'title':passes[0].offer.title,'price':str(passes[0].offer.price) if passes[0].offer.price else None,'url':str(passes[0].offer.url),'score':passes[0].score},'errors':report.errors[:3]}
              if scout.marketplace.value == 'epicentr':
                  ranked = sorted(report.offers, key=lambda x:x.score, reverse=True)[:12]
                  row['diagnostic'] = [{'title':x.offer.title,'price':str(x.offer.price) if x.offer.price else None,'score':x.score,'verdict':x.verdict.value,'conflicts':x.conflicts,'evidence':x.positive_evidence,'url':str(x.offer.url)} for x in ranked]
              return row
          async def main():
              rows = await asyncio.gather(*(one(s) for s in scouts))
              print('PUMA_MULTIMARKET_RESULTS=' + json.dumps(rows, ensure_ascii=False))
          asyncio.run(main())
          PY
# trigger: epicentr conflict diagnostics
