name: PUMA Multimarket Smoke

# Primary PUMA live CI: active marketplaces only. Rozetka remains frozen separately.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/puma-multimarket-smoke.yml'
      - 'src/puma_scouts/**'
      - 'tests/**'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e . pytest pytest-asyncio
      - name: Tests
        run: pytest -q
      - name: Live marketplace smoke
        run: |
          python - <<'PY'
          import asyncio, json
          from collections import Counter
          from puma_scouts.models import ProductMission, Verdict
          from puma_scouts.scouts.epicentr import EpicentrScout
          from puma_scouts.scouts.catalog import PromScout, AlloScout, FoxtrotScout, ComfyScout, KastaScout, HotlineScout
          mission = ProductMission(article='SMOKE-CONTROL', source_data={'name':'Монитор Xiaomi Redmi A27Q 2025 P27QCB-RA 2560x1440 2K IPS 100 Гц 27 Черный','brand':'Xiaomi','model':'P27QCB-RA'})
          scouts = [EpicentrScout(timeout=15,max_candidates_per_query=12),PromScout(timeout=15,max_candidates_per_query=12),AlloScout(timeout=15,max_candidates_per_query=12),FoxtrotScout(timeout=15,max_candidates_per_query=12),ComfyScout(timeout=15,max_candidates_per_query=12),KastaScout(timeout=15,max_candidates_per_query=12),HotlineScout(timeout=15,max_candidates_per_query=12)]
          async def one(scout):
              report = await scout.scan(mission)
              passes = sorted([x for x in report.offers if x.verdict == Verdict.PASS], key=lambda x:x.score, reverse=True)
              prices = Counter(str(x.offer.price) for x in passes if x.offer.price is not None)
              return {'marketplace':scout.marketplace.value,'health':report.health.value,'candidates':report.candidates_collected,'pass_count':len(passes),'price_groups':dict(sorted(prices.items(), key=lambda kv:float(kv[0]))),'best':None if not passes else {'title':passes[0].offer.title,'price':str(passes[0].offer.price) if passes[0].offer.price else None,'url':str(passes[0].offer.url),'score':passes[0].score},'errors':report.errors[:5]}
          async def main():
              rows = await asyncio.gather(*(one(s) for s in scouts))
              print('PUMA_MULTIMARKET_RESULTS=' + json.dumps(rows, ensure_ascii=False))
          asyncio.run(main())
          PY
# primary-ci-v3: force run after workflow cleanup
