name: PUMA Multimarket Smoke

# Active PUMA sources. Rozetka is frozen; Foxtrot and Kasta are intentionally dropped.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/puma-multimarket-smoke.yml'
      - 'src/puma_scouts/**'
      - 'tests/**'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e . pytest pytest-asyncio
      - name: Tests
        run: pytest -q
      - name: Probe Allo native search
        run: |
          python - <<'PY'
          import asyncio, re
          from urllib.parse import quote_plus
          import httpx
          query='Xiaomi Redmi A27Q 2025 P27QCB-RA'
          urls=[
            'https://allo.ua/ua/catalogsearch/result/?q='+quote_plus(query),
            'https://allo.ua/ua/catalogsearch/result/index/?q='+quote_plus(query),
          ]
          async def main():
            headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'uk-UA,uk;q=0.9,en;q=0.8'}
            async with httpx.AsyncClient(timeout=15,follow_redirects=True,headers=headers) as c:
              for url in urls:
                try:
                  r=await c.get(url); text=r.text.replace('\\/','/')
                  product_urls=[]
                  for raw in re.findall(r'https?://[^\\s\"<>]+|/ua/[^\\s\"<>]+?\.html',text):
                    if '.html' in raw and raw not in product_urls: product_urls.append(raw[:300])
                  print('PUMA_ALLO_PROBE',r.status_code,len(text),str(r.url),'html_links=',product_urls[:10],'nuxt=',('_nuxt' in text),'graphql=',('graphql' in text.lower()))
                except Exception as e: print('PUMA_ALLO_PROBE ERROR',type(e).__name__,e)
          asyncio.run(main())
          PY
      - name: Live marketplace smoke
        run: |
          python - <<'PY'
          import asyncio, json
          from collections import Counter
          from puma_scouts.models import ProductMission, Verdict
          from puma_scouts.scouts.epicentr import EpicentrScout
          from puma_scouts.scouts.catalog import PromScout, AlloScout, ComfyScout, HotlineScout
          mission = ProductMission(article='SMOKE-CONTROL', source_data={'name':'Монитор Xiaomi Redmi A27Q 2025 P27QCB-RA 2560x1440 2K IPS 100 Гц 27 Черный','brand':'Xiaomi','model':'P27QCB-RA'})
          scouts = [EpicentrScout(timeout=15,max_candidates_per_query=12),PromScout(timeout=15,max_candidates_per_query=12),AlloScout(timeout=15,max_candidates_per_query=12),ComfyScout(timeout=15,max_candidates_per_query=12),HotlineScout(timeout=15,max_candidates_per_query=12)]
          async def one(scout):
              report = await scout.scan(mission)
              passes = sorted([x for x in report.offers if x.verdict == Verdict.PASS], key=lambda x:x.score, reverse=True)
              prices = Counter(str(x.offer.price) for x in passes if x.offer.price is not None)
              return {'marketplace':scout.marketplace.value,'health':report.health.value,'candidates':report.candidates_collected,'pass_count':len(passes),'price_groups':dict(sorted(prices.items(), key=lambda kv:float(kv[0]))),'best':None if not passes else {'title':passes[0].offer.title,'price':str(passes[0].offer.price) if passes[0].offer.price else None,'url':str(passes[0].offer.url),'score':passes[0].score},'errors':report.errors[:5]}
          async def main():
              rows = await asyncio.gather(*(one(s) for s in scouts))
              print('PUMA_MULTIMARKET_RESULTS=' + json.dumps(rows, ensure_ascii=False))
          asyncio.run(main())
          PY
