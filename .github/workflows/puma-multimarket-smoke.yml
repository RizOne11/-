name: PUMA Multimarket Smoke

# Active broad-market sources. Rozetka frozen; Allo/Comfy paused; Foxtrot/Kasta dropped.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/puma-multimarket-smoke.yml'
      - 'src/puma_scouts/**'
      - 'tests/**'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e . pytest pytest-asyncio
      - name: Tests
        run: pytest -q
      - name: Live broad-market smoke
        run: |
          python - <<'PY'
          import asyncio, json
          from collections import Counter
          from puma_scouts.models import ProductMission, Verdict
          from puma_scouts.scouts.epicentr import EpicentrScout
          from puma_scouts.scouts.catalog import PromScout, ZakupkaScout, HotlineScout
          mission=ProductMission(article='SMOKE-CONTROL',source_data={'name':'Монитор Xiaomi Redmi A27Q 2025 P27QCB-RA 2560x1440 2K IPS 100 Гц 27 Черный','brand':'Xiaomi','model':'P27QCB-RA'})
          scouts=[EpicentrScout(timeout=15,max_candidates_per_query=12),PromScout(timeout=15,max_candidates_per_query=12),ZakupkaScout(timeout=15,max_candidates_per_query=12),HotlineScout(timeout=15,max_candidates_per_query=12)]
          async def one(s):
            r=await s.scan(mission); p=sorted([x for x in r.offers if x.verdict==Verdict.PASS],key=lambda x:x.score,reverse=True); prices=Counter(str(x.offer.price) for x in p if x.offer.price is not None)
            return {'marketplace':s.marketplace.value,'health':r.health.value,'candidates':r.candidates_collected,'pass_count':len(p),'price_groups':dict(prices),'best':None if not p else {'title':p[0].offer.title,'price':str(p[0].offer.price) if p[0].offer.price else None,'url':str(p[0].offer.url),'score':p[0].score},'errors':r.errors[:3]}
          async def main(): print('PUMA_MULTIMARKET_RESULTS='+json.dumps(await asyncio.gather(*(one(s) for s in scouts)),ensure_ascii=False))
          asyncio.run(main())
          PY
      - name: Probe independent Ukrainian shops
        run: |
          python - <<'PY'
          # Diagnostic for the WEB_SHOPS lane: free server-side engines only.
          # We exclude known PUMA sources so results represent independent shops.
          import asyncio,re
          from urllib.parse import quote_plus,urlsplit,parse_qs,unquote
          import httpx
          from bs4 import BeautifulSoup
          q='"Xiaomi Redmi A27Q 2025" "P27QCB-RA" -site:prom.ua -site:epicentrk.ua -site:hotline.ua -site:rozetka.com.ua -site:zakupka.com'
          engines=[('ddg','https://html.duckduckgo.com/html/?q='+quote_plus(q)),('bing','https://www.bing.com/search?q='+quote_plus(q)+'&count=30&setlang=uk'),('brave','https://search.brave.com/search?q='+quote_plus(q)+'&source=web')]
          blocked={'duckduckgo.com','bing.com','www.bing.com','search.brave.com','google.com','www.google.com','prom.ua','epicentrk.ua','hotline.ua','rozetka.com.ua','zakupka.com','youtube.com','facebook.com','instagram.com'}
          async def main():
            headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'uk-UA,uk;q=0.9,en;q=0.8'}; found={}
            async with httpx.AsyncClient(timeout=15,follow_redirects=True,headers=headers) as c:
              for name,url in engines:
                try: text=(await c.get(url)).text
                except Exception as e: print('PUMA_WEB_ENGINE',name,'ERROR',type(e).__name__); continue
                soup=BeautifulSoup(text,'html.parser'); urls=[]
                for a in soup.find_all('a',href=True):
                  x=a['href']; p=urlsplit(x)
                  if 'duckduckgo.com' in p.netloc and p.path.startswith('/l/'):
                    w=parse_qs(p.query).get('uddg',[]); x=unquote(w[0]) if w else x
                  h=urlsplit(x).netloc.lower().removeprefix('www.')
                  if x.startswith('http') and h and h not in blocked and not any(h.endswith('.'+b) for b in blocked): urls.append(x)
                for x in re.findall(r'https?://[^\"\'<>\\\s]+',text.replace('\\/','/')):
                  h=urlsplit(x).netloc.lower().removeprefix('www.')
                  if h and h not in blocked: urls.append(x.rstrip('.,);]'))
                for x in urls: found.setdefault(urlsplit(x).netloc.lower().removeprefix('www.'),x)
                print('PUMA_WEB_ENGINE',name,'bytes',len(text),'domains',list(found)[:12])
            print('PUMA_WEB_SHOPS='+str(list(found.items())[:20]))
          asyncio.run(main())
          PY
