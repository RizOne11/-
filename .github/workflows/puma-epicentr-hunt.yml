name: PUMA Epicentr Hunt
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  epicentr-hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PUMA Scout
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Run tests
        run: pytest -q
      - name: Run live Epicentr hunt
        run: |
          python - <<'PY'
          import asyncio, json
          from pathlib import Path
          from puma_scouts.models import ProductMission
          from puma_scouts.scouts.epicentr import EpicentrScout

          # Control mission uses product identity fields. Supplier article is intentionally unrelated
          # so the live test proves discovery is not dependent on Hubber article equality.
          mission = ProductMission(
              article="CONTROL-NOT-A-SEARCH-KEY",
              source_data={
                  "name": "Монітор Redmi A27Q 2025 з багатофункціональною підставкою",
                  "brand": "Redmi",
                  "model": "P27QCB-RA",
              },
          )

          async def main():
              report = await EpicentrScout(timeout=20.0).scan(mission)
              payload = report.model_dump(mode="json")
              Path("puma-epicentr-hunt.json").write_text(
                  json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8"
              )
              print("PUMA EPICENTR HUNT RESULT")
              print(json.dumps(payload, ensure_ascii=False, indent=2))

          asyncio.run(main())
          PY
      - name: Upload hunt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puma-epicentr-hunt-${{ github.run_number }}
          path: puma-epicentr-hunt.json
          if-no-files-found: warn
