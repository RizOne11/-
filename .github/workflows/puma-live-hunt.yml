name: PUMA Live Hunt

on:
  workflow_dispatch:
    inputs:
      product:
        description: "Exact product/model to hunt"
        required: true
        default: "P27QCB-RA"
  push:
    branches: [main]

jobs:
  live-hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PUMA Scout
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run real Rozetka hunt
        env:
          PUMA_PRODUCT: ${{ github.event.inputs.product || 'P27QCB-RA' }}
        run: |
          python - <<'PY'
          import asyncio, json, os
          from pathlib import Path
          from puma_scouts.models import ProductMission
          from puma_scouts.scouts.rozetka import RozetkaScout

          product = os.environ.get('PUMA_PRODUCT', 'P27QCB-RA')
          print(f'PUMA LIVE HUNT START product={product}')

          async def main():
              mission = ProductMission(article=product, source_data={"model": product})
              report = await RozetkaScout(timeout=20.0).scan(mission)
              payload = report.model_dump(mode='json')
              Path('puma-live-hunt.json').write_text(
                  json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8'
              )
              print('PUMA LIVE HUNT RESULT')
              print(json.dumps(payload, ensure_ascii=False, indent=2))

          asyncio.run(main())
          PY
      - name: Upload hunt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puma-live-hunt-${{ github.run_number }}
          path: puma-live-hunt.json
          if-no-files-found: warn
