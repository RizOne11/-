name: PUMA Live Hunt

# Rozetka is intentionally frozen: keep the workflow for later, but do not run it on pushes.
on:
  workflow_dispatch:

jobs:
  live-hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PUMA Scout
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run real Rozetka hunt
        env:
          PUMA_PRODUCT: P27QCB-RA
        run: |
          python - <<'PY'
          import asyncio, json, os
          from pathlib import Path
          from puma_scouts.models import ProductMission
          from puma_scouts.scouts.rozetka import RozetkaScout
          product = os.environ['PUMA_PRODUCT']
          async def main():
              mission = ProductMission(article=product, source_data={'model': product})
              report = await RozetkaScout(timeout=20.0).scan(mission)
              payload = report.model_dump(mode='json')
              Path('puma-live-hunt.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')
              print(json.dumps(payload, ensure_ascii=False, indent=2))
          asyncio.run(main())
          PY
      - name: Upload hunt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puma-live-hunt-${{ github.run_number }}
          path: puma-live-hunt.json
          if-no-files-found: warn
