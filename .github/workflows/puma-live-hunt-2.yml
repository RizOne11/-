name: PUMA Live Hunt 2
on:
  push:
    paths: ['.github/workflows/puma-live-hunt-2.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Probe P27QCB-RA independent Scout surfaces
        run: |
          python - <<'PY'
          import pkgutil, importlib, inspect, json
          import src
          product='P27QCB-RA'
          markets=('rozetka','prom','epicentr')
          out={m:[] for m in markets}
          for x in pkgutil.walk_packages(src.__path__, src.__name__+'.'):
            market=next((m for m in markets if m in x.name.lower()),None)
            if not market: continue
            mod=importlib.import_module(x.name)
            for n,o in inspect.getmembers(mod):
              if callable(o) and any(k in n.lower() for k in ('search','discover','scout','find')):
                out[market].append([x.name,n])
          print(json.dumps({'product':product,'surfaces':out},indent=2))
          missing=[m for m,v in out.items() if not v]
          if missing: raise SystemExit('Missing executable surfaces: '+','.join(missing))
          PY
