name: PUMA P27QCB-RA Probe
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PUMA and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest httpx
      - name: Run PUMA test suite
        run: python -m pytest -q
      - name: Probe native Rozetka search API
        env:
          PUMA_PRODUCT: P27QCB-RA
        run: |
          python - <<'PY'
          import json, os
          import httpx
          product = os.environ['PUMA_PRODUCT']
          url = 'https://search.rozetka.com.ua/ua/search/api/v6/'
          params = {'text': product, 'page': 1, 'front-type': 'xl', 'country': 'UA', 'lang': 'ua'}
          headers = {'User-Agent': 'Mozilla/5.0', 'Referer': 'https://rozetka.com.ua/', 'Accept': 'application/json, text/plain, */*'}
          r = httpx.get(url, params=params, headers=headers, follow_redirects=True, timeout=20)
          print('NATIVE_SEARCH_STATUS', r.status_code)
          print('NATIVE_SEARCH_URL', r.url)
          print('NATIVE_SEARCH_BODY', r.text[:20000])
          try:
              payload = r.json()
              print('HAS_CONTROL_ID', '592071073' in json.dumps(payload, ensure_ascii=False))
              print('HAS_CONTROL_MODEL', product.casefold() in json.dumps(payload, ensure_ascii=False).casefold())
          except Exception as exc:
              print('NATIVE_SEARCH_JSON_ERROR', type(exc).__name__, str(exc))
          PY
