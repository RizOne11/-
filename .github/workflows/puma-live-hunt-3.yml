name: PUMA P27QCB-RA Probe
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PUMA and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest httpx
      - name: Run PUMA test suite
        run: python -m pytest -q
      - name: Probe exact indexed discovery
        env:
          PUMA_PRODUCT: P27QCB-RA
        run: |
          python - <<'PY'
          import html, re, urllib.parse
          import httpx

          product = 'P27QCB-RA'
          headers = {'User-Agent': 'Mozilla/5.0'}
          queries = [
              f'site:hard.rozetka.com.ua "{product}"',
              f'site:rozetka.com.ua "{product}"',
          ]
          for query in queries:
              q = urllib.parse.quote_plus(query)
              urls = [
                  f'https://www.bing.com/search?q={q}&format=rss',
                  f'https://www.google.com/search?q={q}&num=20&filter=0',
                  f'https://html.duckduckgo.com/html/?q={q}',
              ]
              for url in urls:
                  try:
                      r = httpx.get(url, headers=headers, follow_redirects=True, timeout=20)
                      print('ENGINE', url.split('/')[2], 'STATUS', r.status_code, 'LEN', len(r.text))
                      text = html.unescape(r.text).replace('\\u002F','/').replace('\\/','/')
                      hits = re.findall(r'https?://(?:hard\.)?rozetka\.com\.ua/(?:ua/|ru/)?[^\s"\'<>]*?/p\d+/?', urllib.parse.unquote(text), re.I)
                      exact = [u for u in hits if product.lower().replace('-','') in re.sub(r'[^a-z0-9]+','',u.lower())]
                      print('EXACT_URL_HITS', exact[:10])
                      if product.lower() in text.lower():
                          idx = text.lower().find(product.lower())
                          print('MODEL_CONTEXT', re.sub(r'\s+',' ',text[max(0,idx-400):idx+700])[:1100])
                  except Exception as exc:
                      print('ENGINE_ERROR', type(exc).__name__, str(exc))
          PY
